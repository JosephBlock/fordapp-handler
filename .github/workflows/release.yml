name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build ${{ matrix.arch }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x86_64
            python_arch: x64
            artifact_name: FordAppHandler-windows-x86_64.exe
          - os: windows-latest
            arch: x86
            python_arch: x86
            artifact_name: FordAppHandler-windows-x86.exe
          - os: windows-11-arm
            arch: arm64
            python_arch: arm64
            artifact_name: FordAppHandler-windows-arm64.exe
          - os: ubuntu-latest
            arch: x86_64
            python_arch: x64
            artifact_name: FordAppHandler-linux-x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
            python_arch: arm64
            artifact_name: FordAppHandler-linux-arm64
          - os: macos-latest
            arch: arm64
            artifact_name: FordAppHandler-macos-arm64.zip
          - os: macos-latest
            arch: x86_64
            artifact_name: FordAppHandler-macos-x86_64.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python_arch || 'x64' }}
          cache: 'pip'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable with PyInstaller
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          pyinstaller fordapp.spec

      - name: Prepare Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Verify binary has the correct architecture-specific name
          if (-not (Test-Path "dist/FordAppHandler-windows-${{ matrix.arch }}.exe")) {
              throw "Expected build artifact dist/FordAppHandler-windows-${{ matrix.arch }}.exe was not found"
          }

      - name: Prepare Linux artifact
        if: runner.os == 'Linux'
        run: |
          # Verify binary has the correct architecture-specific name
          if [ ! -f "dist/FordAppHandler-linux-${{ matrix.arch }}" ]; then
              echo "Expected build artifact dist/FordAppHandler-linux-${{ matrix.arch }} was not found"
              exit 1
          fi

      - name: Prepare macOS artifact
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r FordAppHandler-macos-${{ matrix.arch }}.zip FordAppHandler-macos-${{ matrix.arch }}.app

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
          if-no-files-found: error

      - name: Attest build artifact
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/${{ matrix.artifact_name }}

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Determine tag name
        id: tag_name
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=v0.0.0-draft-${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.tag_name.outputs.TAG }}
        run: |
          gh release create "$TAG_NAME" \
            artifacts/* \
            --title "Release $TAG_NAME" \
            --generate-notes \
            --draft=false
